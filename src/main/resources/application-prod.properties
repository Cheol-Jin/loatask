# 배포용 설정: 실제 값은 Render 환경변수에서 받습니다.
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# 새 배포 DB의 테이블을 최초 생성합니다. 기존 테이블/데이터는 삭제하지 않습니다.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/deployment-schema.sql
spring.data.redis.repositories.enabled=false
lostark.api.base-url=https://developer-lostark.game.onstove.com
lostark.api.key=${LOSTARK_API_KEY}
app.cors.allowed-origins=${FRONTEND_ORIGIN:https://loatask.vercel.app}
